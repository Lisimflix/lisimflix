# Weekly version updates. Minor and patch bumps are grouped into one PR per
# ecosystem to save CI minutes (CONTRIBUTING.md "Checks"); majors come alone.
# cooldown: only propose releases at least 14 days old (#66). Security
# updates ignore cooldown, so fixes still arrive straight away.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Types follow the Node major we run (.node-version); bump them with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # openapi-typescript 7.13.0 needs TypeScript ^5 (and typescript-eslint
      # 8.72.0 <6.1.0). Lift when both support a newer major.
      - dependency-name: typescript
        versions: [">=6.0.0"]
  # Dockerfile base images, pinned by digest. A golang/node bump must match
  # server/go.mod's toolchain and .node-version in the same PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # A Node major moves .node-version, CI and @types/node too: do it by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
